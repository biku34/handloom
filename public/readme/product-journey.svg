<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" width="960" height="330" role="img" aria-labelledby="t d">
  <title id="t">The SUTRA product journey</title>
  <desc id="d">Eight stages from loom to buyer: onboard, verify, register, passport, journey, seal, scan and claim. Each stage lights up in turn as a gold thread travels along the rail.</desc>
  <style>
    .bg{fill:#2a0a11}
    .sans{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
    .serif{font-family:Georgia,"Times New Roman",serif}
    .h{fill:#f8eeda;font-size:26px;font-weight:700}
    .sub{fill:#e5c383;font-size:14px;opacity:.85}
    .lbl{fill:#f8eeda;font-size:14px;font-weight:700}
    .role{fill:#e5c383;font-size:12px;opacity:.8}
    .num{fill:#e5c383;font-size:14px;font-weight:700}
    .numlit{fill:#40101a;font-size:14px;font-weight:700}
    .chip{fill:#40101a;stroke:#e5c383;stroke-opacity:.35}
    .chipt{fill:#f0dcb4;font-size:12px}
    .cta{fill:#e5c383}
    .ctat{fill:#40101a;font-size:13px;font-weight:700}
    .rail{stroke:#e5c383;stroke-opacity:.18;stroke-width:4;stroke-linecap:round}
    .prog{stroke:#e5c383;stroke-width:4;stroke-linecap:round;stroke-dasharray:800;stroke-dashoffset:800;animation:prog 10s linear infinite}
    .dot{animation:dot 10s linear infinite}
    .lit{opacity:0}
    .ring{fill:none;stroke:#e5c383;opacity:0;transform-box:fill-box;transform-origin:center}
    @keyframes prog{0%{stroke-dashoffset:800;opacity:1}80%{stroke-dashoffset:0}96%{stroke-dashoffset:0;opacity:1}100%{stroke-dashoffset:0;opacity:0}}
    @keyframes dot{0%{transform:translateX(0);opacity:1}80%{transform:translateX(800px)}96%{transform:translateX(800px);opacity:1}100%{transform:translateX(800px);opacity:0}}
    @keyframes n0{0%{opacity:1}96%{opacity:1}100%{opacity:0}}
    @keyframes n1{0%,10.4%{opacity:0}11.4%,96%{opacity:1}100%{opacity:0}}
    @keyframes n2{0%,21.9%{opacity:0}22.9%,96%{opacity:1}100%{opacity:0}}
    @keyframes n3{0%,33.3%{opacity:0}34.3%,96%{opacity:1}100%{opacity:0}}
    @keyframes n4{0%,44.7%{opacity:0}45.7%,96%{opacity:1}100%{opacity:0}}
    @keyframes n5{0%,56.1%{opacity:0}57.1%,96%{opacity:1}100%{opacity:0}}
    @keyframes n6{0%,67.6%{opacity:0}68.6%,96%{opacity:1}100%{opacity:0}}
    @keyframes n7{0%,79%{opacity:0}80%,96%{opacity:1}100%{opacity:0}}
    @keyframes r0{0%{opacity:.7;transform:scale(1)}6%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r1{0%,11.4%{opacity:0;transform:scale(1)}11.5%{opacity:.7}17.4%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r2{0%,22.9%{opacity:0;transform:scale(1)}23%{opacity:.7}28.9%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r3{0%,34.3%{opacity:0;transform:scale(1)}34.4%{opacity:.7}40.3%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r4{0%,45.7%{opacity:0;transform:scale(1)}45.8%{opacity:.7}51.7%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r5{0%,57.1%{opacity:0;transform:scale(1)}57.2%{opacity:.7}63.1%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r6{0%,68.6%{opacity:0;transform:scale(1)}68.7%{opacity:.7}74.6%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @keyframes r7{0%,80%{opacity:0;transform:scale(1)}80.1%{opacity:.7}86%{opacity:0;transform:scale(1.6)}100%{opacity:0}}
    @media (prefers-reduced-motion:reduce){.prog,.dot,.lit,.ring{animation:none}.prog{stroke-dashoffset:0}.lit{opacity:1}}
  </style>

  <rect class="bg" width="960" height="330" rx="24"/>
  <rect x="40" y="0" width="880" height="4" rx="2" fill="#8c2f39"/>

  <text class="serif h" x="40" y="58">From loom to buyer — one unbroken thread</text>
  <text class="sans sub" x="40" y="84">Every step is verified by a person, sealed in a hash-chained ledger and anchored on Polygon.</text>

  <!-- rail -->
  <line class="rail" x1="80" y1="170" x2="880" y2="170"/>
  <line class="prog" x1="80" y1="170" x2="880" y2="170"/>
  <g class="dot"><circle cx="80" cy="170" r="7" fill="#f8eeda"/><circle cx="80" cy="170" r="12" fill="#e5c383" opacity=".25"/></g>

  <!-- nodes: base, lit fill, pulse ring, number -->
  <g class="sans">
    <circle cx="80" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n0 10s linear infinite" cx="80" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r0 10s linear infinite" cx="80" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="80" y="175" text-anchor="middle">1</text>
    <text class="numlit lit" style="animation:n0 10s linear infinite" x="80" y="175" text-anchor="middle">1</text>
    <text class="lbl" x="80" y="220" text-anchor="middle">Onboard</text>
    <text class="role" x="80" y="238" text-anchor="middle">Co-op</text>

    <circle cx="194.3" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n1 10s linear infinite" cx="194.3" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r1 10s linear infinite" cx="194.3" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="194.3" y="175" text-anchor="middle">2</text>
    <text class="numlit lit" style="animation:n1 10s linear infinite" x="194.3" y="175" text-anchor="middle">2</text>
    <text class="lbl" x="194.3" y="220" text-anchor="middle">Verify</text>
    <text class="role" x="194.3" y="238" text-anchor="middle">Verifier at the loom</text>

    <circle cx="308.6" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n2 10s linear infinite" cx="308.6" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r2 10s linear infinite" cx="308.6" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="308.6" y="175" text-anchor="middle">3</text>
    <text class="numlit lit" style="animation:n2 10s linear infinite" x="308.6" y="175" text-anchor="middle">3</text>
    <text class="lbl" x="308.6" y="220" text-anchor="middle">Register</text>
    <text class="role" x="308.6" y="238" text-anchor="middle">Weaver · 4 taps</text>

    <circle cx="422.9" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n3 10s linear infinite" cx="422.9" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r3 10s linear infinite" cx="422.9" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="422.9" y="175" text-anchor="middle">4</text>
    <text class="numlit lit" style="animation:n3 10s linear infinite" x="422.9" y="175" text-anchor="middle">4</text>
    <text class="lbl" x="422.9" y="220" text-anchor="middle">Passport</text>
    <text class="role" x="422.9" y="238" text-anchor="middle">QR + scratch secret</text>

    <circle cx="537.1" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n4 10s linear infinite" cx="537.1" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r4 10s linear infinite" cx="537.1" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="537.1" y="175" text-anchor="middle">5</text>
    <text class="numlit lit" style="animation:n4 10s linear infinite" x="537.1" y="175" text-anchor="middle">5</text>
    <text class="lbl" x="537.1" y="220" text-anchor="middle">Journey</text>
    <text class="role" x="537.1" y="238" text-anchor="middle">Weave · finish · QC</text>

    <circle cx="651.4" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n5 10s linear infinite" cx="651.4" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r5 10s linear infinite" cx="651.4" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="651.4" y="175" text-anchor="middle">6</text>
    <text class="numlit lit" style="animation:n5 10s linear infinite" x="651.4" y="175" text-anchor="middle">6</text>
    <text class="lbl" x="651.4" y="220" text-anchor="middle">Seal</text>
    <text class="role" x="651.4" y="238" text-anchor="middle">Dispatch locks it</text>

    <circle cx="765.7" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n6 10s linear infinite" cx="765.7" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r6 10s linear infinite" cx="765.7" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="765.7" y="175" text-anchor="middle">7</text>
    <text class="numlit lit" style="animation:n6 10s linear infinite" x="765.7" y="175" text-anchor="middle">7</text>
    <text class="lbl" x="765.7" y="220" text-anchor="middle">Scan</text>
    <text class="role" x="765.7" y="238" text-anchor="middle">Buyer · no app</text>

    <circle cx="880" cy="170" r="20" fill="#40101a" stroke="#e5c383" stroke-opacity=".5" stroke-width="2"/>
    <circle class="lit" style="animation:n7 10s linear infinite" cx="880" cy="170" r="20" fill="#e5c383"/>
    <circle class="ring" style="animation:r7 10s linear infinite" cx="880" cy="170" r="20" stroke-width="2"/>
    <text class="num" x="880" y="175" text-anchor="middle">8</text>
    <text class="numlit lit" style="animation:n7 10s linear infinite" x="880" y="175" text-anchor="middle">8</text>
    <text class="lbl" x="880" y="220" text-anchor="middle">Claim</text>
    <text class="role" x="880" y="238" text-anchor="middle">Clone alarm</text>
  </g>

  <!-- footer chips -->
  <g class="sans">
    <rect class="chip" x="40" y="268" width="170" height="32" rx="16"/>
    <text class="chipt" x="125" y="289" text-anchor="middle">SHA-256 hash chain</text>
    <rect class="chip" x="222" y="268" width="170" height="32" rx="16"/>
    <text class="chipt" x="307" y="289" text-anchor="middle">Anchored on Polygon</text>
    <rect class="chip" x="404" y="268" width="190" height="32" rx="16"/>
    <text class="chipt" x="499" y="289" text-anchor="middle">Human-verified weavers</text>
    <rect class="cta" x="704" y="266" width="216" height="36" rx="18"/>
    <text class="ctat" x="812" y="289" text-anchor="middle">Explore it interactively →</text>
  </g>
</svg>
